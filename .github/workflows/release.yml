name: Release Windows executable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build portable executable
        run: npm run dist

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'release/Codex-CDP-Guard.exe'
          if (-not (Test-Path -LiteralPath $asset)) {
            throw "Release asset not found: $asset"
          }
          gh release create $env:GITHUB_REF_NAME `
            "$asset#Codex-CDP-Guard.exe" `
            --title "Codex CDP Guard $env:GITHUB_REF_NAME" `
            --generate-notes
